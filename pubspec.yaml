name: dyno_lab
description: A responsive motorcycle dyno comparison workspace for the web.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/charts/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
